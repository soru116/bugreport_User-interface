[project]
name = "commit-message-generator"
version = "0.1.0"
description = "Zero-shot Code Llama-Instruct commit message drafts from existing patches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
commit-message = "commit_message.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
